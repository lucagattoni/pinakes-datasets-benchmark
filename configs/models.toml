# The model weights every configuration runs on, pinned to the Hub commit that was in use.
#
# Pinakes records no revision unless the manifest names one (`ModelInfo.revision` is None), so
# without this a run could silently use whatever `main` had become. Pinning changes no behaviour:
# the same files load. It makes Pinakes itself refuse a mismatch, and lets a result file say which
# weights produced it. Both shas were checked against the Hub's `main` and equalled the snapshots
# already cached before the first build, and again on 20261030 21:35 UTC. `pnkbench build` fails if
# Pinakes' stamped model ids differ from these.

[embedding]
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"

[rerank]
model = "BAAI/bge-reranker-base"
revision = "2cfc18c9415c912f9d8155881c133215df768a70"
